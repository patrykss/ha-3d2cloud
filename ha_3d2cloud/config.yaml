name: "HA 3d2cloud"
version: "1.0.7"
slug: "ha_3d2cloud"
description: "Bridge for 3D printer timelapses to YouTube and cloud storage while protecting printer memory."
url: "https://github.com/patrykss/ha-3d2cloud"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
ingress: true
ingress_port: 8080
ports:
  8080/tcp: 8080
panel_icon: mdi:cloud-check-variant
schema:
  youtube_enabled: "bool"
  youtube_client_id: "str?"
  youtube_client_secret: "str?"
  youtube_refresh_token: "str?"
  title_template: "str"
  printer_name: "str"
options:
  youtube_enabled: true
  youtube_client_id: ""
  youtube_client_secret: ""
  youtube_refresh_token: ""
  title_template: "{printer} - {filename} {date}"
  printer_name: "Ender 3 V3 KE"